[[panel]]
id = "ck-openings"
kind = "reading"
title = "An opening: a path into a root, with the prover's siblings"
link = "Every statement of part II is about these three definitions. An opening says where a term sits under a root. It says nothing about who built the root."
left = [
  { file = "verification/lean/Qmdb/Active.lean", lean = "Witness" },
  { file = "verification/lean/Qmdb/Active.lean", lean = "Witness.rebuild" },
  { file = "verification/lean/Qmdb/Active.lean", lean = "Opens" },
  { file = "verification/lean/Qmdb/Active.lean", lean = "Witness.binding", statement = true },
]
right = [{ prose = [
  "A `Witness` walks from a root down to one term. `hash` enters the input of a hash, `left` and `right` enter one side of a concatenation and carry the other side as a sibling.",
  "`rebuild` computes the root again from the term at the tip. `Opens path root tip`: some witness that follows `path` rebuilds `root` from `tip`.",
  "A sibling is any term. The prover chooses it and no statement restricts it.",
  "`Witness.binding`: two witnesses with one path that rebuild one root have the same term at the tip. This is where the ideal hash is used, through `Hash.hash_inj` and `concat_inj`, as in part I.",
  "A path is a list of steps, not a byte offset. A real verifier works on bytes; the model reads production's hash inputs as concatenations of whole fields (assumption A4).",
] }]

