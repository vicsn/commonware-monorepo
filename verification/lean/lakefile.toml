name = "commonware-symbolic-proofs"
version = "0.1.0"
defaultTargets = ["Commonware", "Qmdb", "Bls"]
# The extraction's Lean, which DyLean is patched for; keeps `lake update` from adopting DyLean's.
fixedToolchain = true

# Style linters for the handwritten Lean. Mathlib defines them and every module loads them through
# Aeneas; `weak` keeps a module without them building. check.sh fails on any warning.
[leanOptions]
weak.linter.style.longLine = true
weak.linter.style.whitespace = true
weak.linter.style.cdot = true
weak.linter.style.lambdaSyntax = true
weak.linter.style.dollarSyntax = true
weak.linter.style.multiGoal = true
weak.linter.style.missingEnd = true
weak.linter.style.emptyLine = true
weak.linter.style.show = true
weak.linter.style.setOption = true
weak.linter.style.refine = true
weak.linter.style.docString = true
weak.linter.missingDocs = true

# Glue between the extracted Rust and DyLean that every target shares.
[[lean_lib]]
name = "Commonware"
globs = ["Commonware.+"]

# QMDB inclusion: the extracted verifier and client, and their DyLean protocol.
[[lean_lib]]
name = "Qmdb"
globs = ["Qmdb.+"]

# BLS certificates: the extracted certificate rules and client, and their DyLean protocol.
[[lean_lib]]
name = "Bls"
globs = ["Bls.+"]

# The hax extraction of verification/symbolic.
[[require]]
name = "commonware-symbolic"
path = "../symbolic/proofs/lean"

# DyLean at its pin, patched for Lean 4.35 by toolchain.sh.
[[require]]
name = "dylean"
path = "../.lake/dylean"
