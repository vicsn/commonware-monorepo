# Side-by-side panels of the audit guide. `build.py` resolves every item by name and fails when one
# is missing or ambiguous. Kinds: rust-rust, rust-generated, rust-trusted, spec-generated,
# lean-lean, reading. Strengths: proved, tested, trusted, assumed, shared, none.
#
# An item is one of:
#   { file, rust = "fn NAME" | "const NAME" | "trait NAME" | "impl TEXT", within = "impl TEXT" }
#   { file, lean = "NAME", statement = true }      a handwritten Lean declaration; `doc = false`
#                                                  leaves out its comment, `context = false` the
#                                                  `variable` lines in scope
#   { generated = "NAME" }                         a generated Lean declaration
#   { source_of = "NAME" }                         the Rust that hax recorded for it
#   { file, from = "text", through = "text" }      lines between two anchors
#   { prose = ["...", "..."] }                     reading notes
# `from` and `through` also narrow a named item to an excerpt. Without `through` the excerpt runs
# to the end of the item, or of the file. A reading panel needs no strength.

[index]
prefixes = [
  "storage/src/merkle/",
  "verification/symbolic/src/qmdb.rs",
  "verification/symbolic/src/client.rs",
]

# Step 0: primer and warm-up.

[[panel]]
id = "primer"
kind = "reading"
title = "How to read a Lean statement"
link = "Everything before the last top-level colon is given; what follows it is proved. The proof after `:=` is checked by Lean and is never required reading."
left = [{ file = "verification/lean/Qmdb/SecurityTheorems.lean", lean = "production_binding_or_collision", statement = true, context = false }]
right = [{ prose = [
  "The text between `/--` and `-/` is a comment. Lean does not check it against the statement.",
  "`{D : Type} [DecidableEq D]`: for any type of digests whose equality can be decided.",
  "`(B : ByteHash D)`: for any hash over byte strings. Step 5 shows what a `ByteHash` is.",
  "`Std.U32`, `Std.U64`, `Slice Std.U8`: Rust's `u32`, `u64` and `&[u8]`. `.val` is the number or the list behind one.",
  "`(ha : qmdb.verify … = RustM.ok true)`: a hypothesis, named `ha`. The extracted Rust function `verify`, run with that hash, returned `true`. `RustM` is the result of extracted Rust: `ok v`, a failure such as a panic or an overflow, or divergence.",
  "After the colon: `a = b ∨ ∃ x y, …`. The items are equal, or there are `x` and `y` such that `finder` returns exactly that pair, they differ, and they hash alike.",
  "Every real hash has collisions, so `a collision exists` alone would say nothing. The statement names a computation on the two openings that outputs one. Read `finder` in step 1 for that reason.",
  "Trace statements add two notions: `tr.Reachable reachability` is any sequence of attacker sends and client steps, and `tr.EventLoggedAt e t` says that the client logged `e` at time `t`.",
] }]

[[panel]]
id = "leaf-step"
kind = "rust-generated"
strength = "assumed"
title = "Warm-up: the leaf client step and its extraction"
link = "hax, Charon and Aeneas produce the right side from the left. The audit assumes this translation (A1); `check.sh` only confirms that regenerating it reproduces the committed file."
left = [{ source_of = "leaf.client_step" }]
right = [{ generated = "leaf.client_step" }]
notes = [
  "A `do` block runs the steps in order and stops at the first failure. `let x ← f` binds the result of `f`.",
  "The trait bound `T: Terms + Messages` became two explicit arguments, `termsTermsInst` and `clientMessagesInst`. Lean chooses what to pass for them: that choice is the subject of step 5.",
  "`==` on digests became `corecmpPartialEqInst.eq`, a field of the `Terms` instance.",
]

[[panel]]
