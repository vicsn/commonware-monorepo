# Side-by-side panels of the audit guide. `build.py` resolves every item by name and fails when one
# is missing or ambiguous. Kinds: rust-rust, rust-generated, rust-trusted, spec-generated,
# lean-lean, reading. Strengths: proved, tested, trusted, assumed, shared, none.
#
# An item is one of:
#   { file, rust = "fn NAME" | "const NAME" | "trait NAME" | "impl TEXT", within = "impl TEXT" }
#   { file, lean = "NAME", statement = true }      a handwritten Lean declaration; `doc = false`
#                                                  leaves out its comment, `context = false` the
#                                                  `variable` lines in scope
#   { generated = "NAME" }                         a generated Lean declaration
#   { source_of = "NAME" }                         the Rust that hax recorded for it
#   { file, from = "text", through = "text" }      lines between two anchors
#   { prose = ["...", "..."] }                     reading notes
# `from` and `through` also narrow a named item to an excerpt. Without `through` the excerpt runs
# to the end of the item, or of the file. A reading panel needs no strength.

[index]
prefixes = [
  "storage/src/merkle/",
  "verification/symbolic/src/qmdb.rs",
  "verification/symbolic/src/client.rs",
]

# Step 0: primer.

[[panel]]
id = "primer"
kind = "reading"
title = "How to read a Lean statement"
link = "Everything before the last top-level colon is given; what follows it is proved. The proof after `:=` is checked by Lean and is never required reading."
left = [{ file = "verification/lean/Qmdb/Verifier.lean", lean = "unique", statement = true, context = false }]
right = [{ prose = [
  "The text between `/--` and `-/` is a comment. Lean does not check it against the statement.",
  "`(h : Std.U32) (loc : Std.U64)`: for any height and any location. `Std.U32`, `Std.U64` and `Slice Std.U8` are Rust's `u32`, `u64` and `&[u8]`; `.val` is the number or the list behind one.",
  "`(root : Bytes)` and `(wa wb : Slice Bytes)`: a root and two lists of siblings. `Bytes` is a DyLean term, not a byte string: a literal, a concatenation or a hash.",
  "`(ha : qmdb.verify dyTerms () h loc root a wa = RustM.ok true)`: a hypothesis, named `ha`. The extracted Rust function `verify` returned `true`. `RustM` is the result of extracted Rust: `ok v`, a failure such as a panic or an overflow, or divergence.",
  "`dyTerms` says what a hash is in this statement: DyLean's hash constructor. Step 5 shows it. No statement here is about a real hash function.",
  "After the colon: `a = b ∧ wa = wb`. The two items are equal and so are the two sibling lists.",
  "Trace statements add two notions: `tr.Reachable reachability` is any sequence of attacker sends and client steps, and `tr.EventLoggedAt e t` says that the client logged `e` at time `t`.",
] }]

# Step 1: what is claimed.

[[panel]]
id = "term-equality"
kind = "lean-lean"
strength = "proved"
title = "Why one root admits one opening"
link = "A digest is a term. `Hash.hash_inj` of DyLean says that two hash terms are equal only if their inputs are, and the two lemmas on the right say the same of concatenations and of literals. So a root fixes its peak, a node its two children and a leaf its item, all the way down."
left_label = "Digests fix what is below them"
left = [
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "leafTerm_inj", context = false },
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "nodeTerm_inj", context = false },
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "rootTerm_inj", context = false },
]
right_label = "What that rests on"
right = [
  { file = "verification/lean/Commonware/Symbolic/Terms.lean", lean = "concat_inj", statement = true, context = false },
  { file = "verification/lean/Commonware/Symbolic/Terms.lean", lean = "part_bytes_inj", statement = true, context = false },
]
notes = [
  "This is how ProVerif and Tamarin treat a hash by default: a free constructor. There is no collision to find and no reduction to a collision.",
  "`unique` follows by induction over the extracted traversal: two accepted openings rebuild the same root term, so every digest on the path agrees, the siblings agree and the items agree.",
  "The proofs are shown here because they are one line each. They are still not required reading.",
]

