  "Production concatenates the bytes of the parts and hashes them. The model applies a constructor to the parts and keeps them apart.",
  "Collisions. The model has none. A real hash has them and is believed to hide them. No statement here reduces a broken opening to a collision.",
  "Boundaries between parts. Bytes lose them. A leaf input is a position and an item, a node input a position and two digests, and an item may be as long as two digests. Only the position tells the two apart, and it does so because one position is never both a leaf and a node in a tree of one trusted size. The model cannot state this.",
  "Kinds of input. In bytes, the root input of a forward-fold tree with fewer than 65,536 leaves is also the leaf input at position 0 of a 34-byte item. The probe `probe_root_is_a_leaf_input` finds the two digests equal for all seven trees it builds. In the model a root is never a leaf digest.",
] }]

