strength = "trusted"
title = "The three `#combine` blocks that define statements"
link = "`#combine` assembles DyLean's types from the listed parts. These three fix what a term is, what a trace holds and which actions build a reachable trace."
left = [
  { file = "verification/lean/Qmdb/Assumptions.lean", from = "#combine +toplevel into BytesFunctor", through = "Hash,", label = "terms" },
  { file = "verification/lean/Qmdb/Protocol.lean", from = "#combine +toplevel into ExecEntryT", through = "ProtocolEvent Opened,", label = "trace entries" },
  { file = "verification/lean/Qmdb/Protocol.lean", from = "#combine into ReachabilityConfig", through = "client,", label = "reachable traces" },
]
right = [{ prose = [
  "Terms: literals, concatenations and hashes, and nothing else. The attacker can build any term from these and from what it has seen.",
  "Trace entries: messages on the network and `Opened` events.",
  "Reachable traces: the attacker sends a message it can derive (`Network`), or the client runs with any handle, any location and any siblings (`client`). There is no other party and no key.",
  "The other `#combine` blocks in `Protocol.lean` and the event invariant set up the proof. A mistake in them makes the build fail; it cannot change what the theorems say.",
] }]

[[panel]]
id = "patch"
kind = "reading"
strength = "trusted"
title = "The compatibility patch applied to DyLean"
link = "DyLean is built at its pin with these three changes. None adds an axiom. The first adds a definition that the statements depend on."
left = [{ file = "verification/lean435.patch", from = "--- a/DY/EquationalTheory/Literal.lean", label = "lean435.patch" }]
right = [{ prose = [
  "Hunk 1 adds an ordering on byte arrays, with its laws proved. DyLean targets a newer Lean that has one in its library; its literal terms use it, so it is part of what a term is here.",
  "Hunk 2 drops an argument from an error message of a tactic.",
  "Hunk 3 registers a trace class only if Aeneas has not already registered one of the same name.",
] }]

# Step 1: the claim table. Every sentence must occur verbatim in the report.

[[claim]]
sentence = "For any hash, two openings that the extracted production verifier accepts at one location under one root carry the same item and the same siblings, or a checked finder returns two different hash inputs with the same digest."
backed_by = [{ file = "verification/lean/Qmdb/SecurityTheorems.lean", lean = "production_unique_or_collision" }]
reading = "Both openings are checked against the same trusted height `h`. `Any hash` means any hash of byte strings with fixed-length digests; `Verifier.unique_or_collision` is the fully general form."

[[claim]]
sentence = "The verifier is total and accepts honest openings."
backed_by = [
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "verify_total" },
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "honest_opening" },
]
reading = "`verify_total`: a verdict on every input, so no panic and no divergence. `honest_opening`: honest means built by `honestRoot` and `honestSiblings`, which are Lean definitions, not production's tree builder."

[[claim]]
sentence = "For any hash on DyLean terms, every opening that the extracted client logs on a reachable trace identifies the trusted snapshot height and an in-range location, and its item is the stored one or the finder returns a collision between the logged opening and the snapshot’s."
backed_by = [{ file = "verification/lean/Qmdb/SecurityTheorems.lean", lean = "extracted_client_authentication" }]
reading = "`Stored` means `Snapshot.items`. The property holds for every message, location and sibling list, so the trace adds no hypothesis beyond `Symbolic.client_step_sound`."

[[claim]]
sentence = "With DyLean’s collision-free hash the logged item is the stored one, and an accepted opening is the only one at its location under its root."
backed_by = [
  { file = "verification/lean/Qmdb/SecurityTheorems.lean", lean = "collision_free_client_authentication" },
  { file = "verification/lean/Qmdb/SecurityTheorems.lean", lean = "production_unique" },
]
reading = "The hypothesis `free` says the hash is injective. That holds for DyLean's constructor and for no real hash."

[[claim]]
sentence = "The snapshot supplies a root and an accepted opening for each stored item; such snapshots exist for every hash at every height up to MAX_HEIGHT."
backed_by = [{ file = "verification/lean/Qmdb/SecurityTheorems.lean", lean = "honest_snapshots_exist" }]
reading = "The assumption is not contradictory. It does not show that production's tree builder produces such a snapshot; the tests in step 6 sample that."

[[claim]]
sentence = "It rejects heights above MAX_HEIGHT and out-of-range locations, accepts honest openings and rejects them when an unused sibling follows."
backed_by = [
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "verify_true" },
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "extra_sibling_rejected" },
]
reading = "`verify_true`: acceptance implies `h ≤ maxHeight` and an in-range location. `extra_sibling_rejected`: one unused sibling after the honest ones. Neither is restated in `SecurityTheorems.lean`."

