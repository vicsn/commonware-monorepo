left_label = "Assumed"
left = [{ file = "verification/lean/Leaf/Assumptions.lean", lean = "Commitment" }]
right_label = "Proved"
right = [{ file = "verification/lean/Leaf/Protocol.lean", lean = "client_authentication", statement = true, context = false }]

# Step 1: what is claimed.

[[panel]]
id = "finder"
kind = "lean-lean"
strength = "proved"
title = "The collision finder and two executed runs"
link = "`reconstruct_inputs` and `verify_inputs` in `Verifier.lean` prove that an accepting run of the extracted verifier hashes exactly the inputs that `inputs` lists. The runs on the right execute the finder on two hashes that collide."
left_label = "Definition"
left = [
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "finder", context = false },
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "openingInputs", context = false },
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "inputs", context = false },
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "pos", context = false },
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "domain", context = false },
]
right_label = "Executed"
right = [
  { file = "verification/lean/Qmdb/SanityChecks.lean", from = "-- Executed: for `Alice` and `Bob`", through = "66, 111, 98])", label = "one digest for everything" },
  { file = "verification/lean/Qmdb/SanityChecks.lean", from = "-- Executed: for those two openings", through = "[0, 0, 0, 0, 0, 0, 0, 2, 1, 0])", label = "leaves told apart, nodes not" },
]
notes = [
  "`inputs` walks from the root's subtree down to the leaf: one hash input per level, so `height + 1` inputs, plus the root's in `openingInputs`.",
  "`finder` pairs the two lists position by position and returns the first pair that differs and has one digest. It uses nothing but the two openings and the hash.",
  "A wrong finder could not make a theorem false: it only appears as `finder … = some (x, y)` with `x ≠ y` and equal digests stated beside it.",
  "`domain` is built from the constants of the extracted client, whatever their value. The proofs therefore do not fix the domain bytes.",
]

