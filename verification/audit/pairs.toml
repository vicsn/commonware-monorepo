# Step 9: the model and what it assumes.

[[panel]]
id = "ck-raw"
kind = "reading"
title = "The check that a reader of a checkpoint runs, as a Lean definition"
link = "This is the object of `RawProof.sound` and `header_of_verify`. Read it as a specification of `OperationProof::verify` for one location and 32-byte chunks. Production's extracted verifier refines it (step 11)."
left = [
  { file = "verification/lean/Qmdb/Mmb/Raw.lean", lean = "RawProof" },
  { file = "verification/lean/Qmdb/Mmb/Raw.lean", lean = "RawProof.fieldsValid" },
  { file = "verification/lean/Qmdb/Mmb/Raw.lean", lean = "RawProof.reconstruct" },
  { file = "verification/lean/Qmdb/Mmb/Raw.lean", lean = "RawProof.verify" },
]
right = [{ prose = [
  "`RawProof`: the decoded fields of one operation proof. The location, the leaf count, the inactive-peak count and the encoded operation are arguments of `verify`, not fields.",
  "`fieldsValid`: the bit of the location is set in the claimed chunk; the digest list has the length that the plan requires; every digest is 32 bytes; the pending and trailing digests are present exactly when the leaf count says so, and when the location lies in one of them, the digest is the hash of the claimed chunk.",
  "`reconstruct`: take the plan for these dimensions and this location, check the fields, and fill the plan's tree with them.",
  "`verify`: the value of that tree equals the root. The root is the only trusted input.",
  "The plan is always taken with the graft flag `true`. A proof whose chunk is all zero fails the bit check, so the other value of the flag is never needed.",
] }]

[[panel]]
id = "ck-plan"
kind = "reading"
title = "The plan: which hash inputs lead from one location to the root"
link = "`plan` fixes the shape of the root for one location from three numbers. `currentPaths` reads the two paths of an opening from it. `Mmb.Accepts`, the conclusion of `RawProof.sound`, is stated with `currentPaths`."
left = [
  { file = "verification/lean/Qmdb/Mmb/Plan.lean", lean = "Shape" },
  { file = "verification/lean/Qmdb/Mmb/Plan.lean", lean = "plan" },
  { file = "verification/lean/Qmdb/Mmb/Plan.lean", lean = "envelope" },
  { file = "verification/lean/Qmdb/Mmb/Plan.lean", lean = "currentPaths" },
]
right = [{ prose = [
  "A `Shape` is a program of hash calls over named inputs: the item, the bitmap chunk, sibling `i` of the digest list, the ops root, the two suffix digests and 8-byte words.",
  "`plan`: the location is below the leaf count, the leaf count is at most the MMB maximum, and the inactive-peak count is at most the number of peaks. It finds the peak that holds the location and assembles the tree.",
  "`envelope` is the outside of every tree: the hash of the ops root and the Merkle root, followed by the pending chunk and by the partial chunk with its bit count, when the leaf count has them. When the location lies in one of the two, its field is the hash of the bitmap chunk.",
  "The Merkle root is `merkleShape`: the domain bytes, the leaf count, then the inactive-peak count when it is not zero, then the bagged peaks, as production's `terms::root` lays them out.",
  "Step 11 proves that production's verifier computes this plan.",
] }]

[[panel]]
id = "ck-snapshot"
kind = "reading"
title = "What is assumed of the writer"
link = "Every soundness statement of part II takes one of these structures as a hypothesis. Their proof fields are the assumptions of part II about the database that produced the root. No Rust is extracted for the writer, and no test compares a production database with them."
left = [
  { file = "verification/lean/Qmdb/Active.lean", lean = "Snapshot" },
  { file = "verification/lean/Qmdb/Ordered.lean", lean = "Snapshot" },
  { file = "verification/lean/Qmdb/Mmb.lean", lean = "Layout" },
]
right = [{ prose = [
  "`Active.Snapshot`: a root, a leaf count, the encoded operation and the bitmap chunk of every location, and a path for each. `itemOpening` and `chunkOpening`: the root opens to them at those paths. `liveCovered`: a chunk with a set bit has a path.",
  "`Ordered.Snapshot` adds the journal. `encoded`: the items are the encoded entries. `activeUpdate`: the bit of an update is set exactly when no later operation touches its key. `adjacent`: no live key lies strictly between a live key and its recorded successor. `commitBounds`: a live commit is the last entry, and no live location is below its floor.",
  "`Mmb.Layout`: the snapshot's paths are the planner's, and where a grafted chunk is all zero, the field that a bitmap path would address holds an 8-byte node position. That is what keeps a prover from presenting a zero chunk's subtree as a chunk with a set bit.",
  "`honest_snapshots_exist` of part I has no counterpart here for every size: the examples of step 8 build these structures for one leaf and for three.",
  "What to ask: does production's writer maintain each field after every commit, including after pruning and a restart?",
] }]

[[panel]]
id = "ck-journal"
kind = "reading"
title = "What a read should return: replaying the journal"
link = "`lookup` is `replay` up to the leaf count. It is the reference that `accepted_read` compares a claim with, and it does not mention a bitmap, a root or a proof."
left = [
  { file = "verification/lean/Qmdb/Ordered/Journal.lean", lean = "Operation" },
  { file = "verification/lean/Qmdb/Ordered/Journal.lean", lean = "Operation.write" },
  { file = "verification/lean/Qmdb/Ordered/Journal.lean", lean = "replay" },
  { file = "verification/lean/Qmdb/Ordered/Journal.lean", lean = "Between" },
]
right = [{ prose = [
  "An entry updates a key with a value and the next live key, deletes a key, or commits with optional metadata and a floor.",
  "`replay`: the last write to the key below the bound decides. An update gives its value, a delete gives none, and a commit leaves the key alone.",
  "`Between start stop key`: the key lies strictly inside the arc from `start` to `stop`, which wraps around when `stop` is not above `start`. A single key that is its own successor excludes every other key.",
  "The model has no pruning: `entry` is defined at every location, and the floor only bounds which locations may be live.",
] }]

