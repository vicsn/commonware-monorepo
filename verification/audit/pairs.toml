sentence = "Two openings that the extracted verifier accepts at one location under one root, for one trusted height, carry the same item and the same siblings."
backed_by = [{ file = "verification/lean/Qmdb/Verifier.lean", lean = "unique" }]
reading = "The hash is `dyTerms`, DyLean's constructor. The extracted verifier is `qmdb::verify` of the verification-only client, not production's `Proof::verify_element_inclusion`. Position binding is the first half of the conclusion."

[[claim]]
sentence = "The verifier is total and accepts honest openings."
backed_by = [
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "verify_total" },
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "honest_opening" },
]
reading = "`verify_total`: a verdict on every input, so no panic and no divergence. `honest_opening`: honest means built by `honestRoot` and `honestSiblings`, which are Lean definitions, not production's tree builder."

[[claim]]
sentence = "Every acceptance that the extracted client logs on a reachable trace identifies the trusted snapshot height, an in-range location and the item stored there."
backed_by = [{ file = "verification/lean/Qmdb/SecurityTheorems.lean", lean = "client_authentication" }]
reading = "`Stored` means `Snapshot.items`. The property holds for every message, location and sibling list, so the trace adds no hypothesis beyond `Symbolic.client_step_sound`."

[[claim]]
sentence = "Some reachable trace logs the honest acceptance of each stored item."
backed_by = [{ file = "verification/lean/Qmdb/SecurityTheorems.lean", lean = "honest_acceptance_logged" }]
reading = "The trace is an attempt: the attacker sends the item, and the client runs on the siblings that the snapshot supplies. `attempt_logs` shows that the accepted event is in the trace. `client_authentication` alone does not, because a Hoare triple holds of an action that fails."

[[claim]]
sentence = "The snapshot supplies a root and an accepted opening for each stored item; such snapshots exist at every height up to MAX_HEIGHT."
backed_by = [{ file = "verification/lean/Qmdb/SecurityTheorems.lean", lean = "honest_snapshots_exist" }]
reading = "The assumption is not contradictory. It does not show that production's tree builder produces such a snapshot; the tests in step 6 sample that."

[[claim]]
sentence = "It rejects heights above MAX_HEIGHT and out-of-range locations, accepts honest openings and rejects them when an unused sibling follows."
backed_by = [
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "verify_bounds" },
  { file = "verification/lean/Qmdb/Verifier.lean", lean = "extra_sibling_rejected" },
]
reading = "`verify_bounds`: acceptance implies `h ≤ maxHeight` and an in-range location. `extra_sibling_rejected`: one unused sibling after the honest ones."

