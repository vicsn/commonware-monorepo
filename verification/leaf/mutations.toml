# Mutations of the Rust that hax extracts for the leaf target. See qmdb/mutations.toml for the
# format. The mutation of the production leaf hash is listed there, because it breaks both targets.

[[mutation]]
name = "leaf client skips the comparison"
file = "verification/symbolic/src/leaf.rs"
original = "if terms::leaf_digest(terms, POSITION, item) == *commitment {"
mutated = "if true {"
fails = "Leaf.Step"

[[mutation]]
name = "leaf client hashes an empty item"
file = "verification/symbolic/src/leaf.rs"
original = "if terms::leaf_digest(terms, POSITION, item) == *commitment {"
mutated = "if terms::leaf_digest(terms, POSITION, &[]) == *commitment {"
fails = "Leaf.Step"
